name: Build PowerBat
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Projektstruktur herstellen
        run: |
          if [ -d src/main/java ]; then
            echo "src/main/java ist schon vorhanden - nichts zu tun"
          else
            for f in *.java; do
              pkg=$(grep -m1 '^package ' "$f" | sed -E 's/package ([^;]+);.*/\1/' | tr '.' '/')
              mkdir -p "src/main/java/$pkg"
              mv "$f" "src/main/java/$pkg/"
            done
            mkdir -p src/main/resources
            for r in plugin.yml config.yml messages.yml clans.yml; do
              if [ -f "$r" ]; then mv "$r" src/main/resources/; fi
            done
          fi
          find src -type f | sort
          echo "Java-Dateien: $(find src -name '*.java' | wc -l)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - run: mvn -B clean package

      - name: Inhalt der Jar anzeigen
        run: unzip -l target/PowerBat.jar | grep -E "plugin.yml|PowerBat.class|messages.yml|config.yml"

      - uses: actions/upload-artifact@v4
        with:
          name: PowerBat
          path: target/PowerBat.jar
